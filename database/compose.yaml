name: influxdb3

services:
  influxdb3-volume-init:
    image: influxdb:3.11-core
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R 1500:1500 /var/lib/influxdb3/data /var/lib/influxdb3/plugins /db
    restart: "no"
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
      - influxdb3-plugins:/var/lib/influxdb3/plugins
      - influxdb3-explorer-data:/db

  influxdb3-core:
    image: influxdb:3.11-core
    container_name: influxdb3-core
    restart: unless-stopped
    depends_on:
      influxdb3-volume-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --admin-token-file=/run/secrets/admin-token
      - --disable-authz=health
    secrets:
      - admin-token
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
      - influxdb3-plugins:/var/lib/influxdb3/plugins
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8181/health
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  influxdb3-explorer:
    image: influxdata/influxdb3-ui:1.9.0
    container_name: influxdb3-explorer
    command:
      - --mode=admin
    restart: unless-stopped
    depends_on:
      influxdb3-volume-init:
        condition: service_completed_successfully
      influxdb3-core:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SESSION_SECRET_KEY: "${EXPLORER_SESSION_SECRET_KEY:?Set EXPLORER_SESSION_SECRET_KEY in .env}"
    volumes:
      - influxdb3-explorer-data:/db

secrets:
  admin-token:
    file: ./secrets/admin-token.json

volumes:
  influxdb3-data:
  influxdb3-plugins:
  influxdb3-explorer-data:
